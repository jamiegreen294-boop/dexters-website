<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dexter's Table Order</title><style>:root{--bg:#07111f;--panel:#10213a;--line:#28415f;--text:#f7fbff;--muted:#9eb0c5;--accent:#ffd43b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}header{position:sticky;top:0;z-index:5;background:#08182a;border-bottom:1px solid var(--line);padding:14px}.brand{font-size:24px;font-weight:1000}.table{color:#07111f;background:var(--accent);padding:5px 9px;border-radius:999px;font-weight:900;font-size:12px}.wrap{max-width:900px;margin:auto;padding:12px}.notice{background:#0e1d31;border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.cat{white-space:nowrap;border:0;border-radius:999px;padding:10px 12px;background:#142641;color:#fff;font-weight:900}.cat.on{background:var(--accent);color:#07111f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#12223a;border:1px solid var(--line);border-radius:16px;padding:12px}.item h3{margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.price{color:var(--accent);font-weight:1000;font-size:18px}.add{width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;background:var(--accent);font-weight:1000}.cart{margin-top:14px;background:#0e1d31;border:1px solid var(--line);border-radius:16px;padding:12px}.line{padding:9px 0;border-bottom:1px solid var(--line)}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:9px;padding:7px 10px;background:#203a5d;color:#fff;font-weight:900}.send,.bill{width:100%;border:0;border-radius:14px;padding:15px;font-weight:1000;margin-top:10px}.send{background:var(--accent);color:#07111f}.bill{background:#fff;color:#07111f}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #31506f;background:#09182a;color:#fff;margin:6px 0}.status{font-size:13px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.hide{display:none}.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#10213a;border:1px solid #31506f;border-radius:20px;padding:16px}.opt{width:100%;text-align:left;margin:5px 0;border:1px solid #31506f;background:#142945;color:#fff;border-radius:12px;padding:11px}.opt.on{background:var(--accent);color:#07111f}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><div style="display:flex;align-items:center;gap:10px"><div class="brand">Dexter's</div><span class="table" id="tableBadge">TABLE ORDER</span></div></header><div class="wrap"><div class="notice"><b>Order from your table</b><div class="muted">Choose your items below and send your order directly to Dexter's till.</div></div><div class="cats" id="cats"></div><div class="grid" id="items"></div><div class="cart"><h2 style="margin-top:0">Your table order</h2><div id="lines"></div><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:1000;margin-top:10px"><span>Total</span><span id="total">£0.00</span></div><textarea id="note" class="field" rows="3" placeholder="Any notes for the kitchen?"></textarea><button id="send" class="send">SEND ORDER</button><button id="bill" class="bill">REQUEST BILL</button><div id="status" class="status">Your place is linked automatically from the QR code.</div></div></div><div id="mods" class="modal hide"><div class="box"><h2 id="modTitle"></h2><div id="modGroups"></div><button id="modAdd" class="send">ADD TO ORDER</button><button id="modCancel" class="bill">CANCEL</button></div></div><script>const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa',API=U+'/functions/v1/uber-table-service-pc-test-api';const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toFixed(2),num=v=>Number(String(v||'').replace(/[^0-9.]/g,''))||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const PLACE_LABELS={1:'Inside Table 1',2:'Inside Table 2',3:'Outside Table 1',4:'Outside Table 2',5:'Bar Chair 1',6:'Bar Chair 2',7:'Bar Chair 3'};const q=new URLSearchParams(location.search),TABLE=Number(q.get('table')||0);if(!Number.isInteger(TABLE)||!PLACE_LABELS[TABLE]){document.body.innerHTML='<div style="padding:30px">Invalid Dexter table QR code.</div>';throw Error('invalid table')}const PLACE=PLACE_LABELS[TABLE];$('tableBadge').textContent=PLACE.toUpperCase();const S={cats:[],groups:new Map(),cat:'',cart:[],editing:null,selected:new Map()};async function load(){const r=await fetch(U+'/rest/v1/rpc/loyalty_menu_public',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});S.cats=await r.json();S.cat=S.cats[0]?.name||'';await loadMods();renderCats();renderItems();renderCart()}async function loadMods(){const rows=[];for(let off=0;;){const r=await fetch(U+'/rest/v1/rpc/loyalty_modifier_public?order=menu_item_id.asc,group_id.asc,option_id.asc&limit=500&offset='+off,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});if(!r.ok)break;const p=await r.json();if(!p.length)break;rows.push(...p);off+=p.length}for(const row of rows){const id=String(row.menu_item_id),gid=String(row.group_id);let gs=S.groups.get(id)||[];let g=gs.find(x=>x.id===gid);if(!g){g={id:gid,name:row.group_name,required:!!row.required,min:Number(row.min_select||0),max:row.max_select==null?null:Number(row.max_select),type:row.selection_type,options:[]};gs.push(g);S.groups.set(id,gs)}g.options.push({id:String(row.option_id),name:row.option_name,price:Number(row.price_delta||0)})}}function renderCats(){$('cats').innerHTML=S.cats.map(c=>'<button class="cat '+(c.name===S.cat?'on':'')+'" data-c="'+esc(c.name)+'">'+esc(c.name)+'</button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;renderCats();renderItems()})}function renderItems(){const c=S.cats.find(x=>x.name===S.cat),a=(c?.items||[]).filter(i=>i.in_stock!==false);$('items').innerHTML=a.map(i=>'<div class="item"><h3>'+esc(i.name)+'</h3><div class="muted">'+esc(i.description||'')+'</div><div class="price">'+esc(i.price||'£0.00')+'</div><button class="add" data-i="'+esc(i.id||i.name)+'">ADD</button></div>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose({...a.find(x=>String(x.id||x.name)===b.dataset.i),category_name:c.name}))}function choose(i){const gs=S.groups.get(String(i.id))||[];if(!gs.length){S.cart.push({id:i.id,name:i.name,qty:1,unit:num(i.price),mods:[]});renderCart();return}S.editing=i;S.selected=new Map();$('modTitle').textContent=i.name;$('mods').classList.remove('hide');renderGroups()}function renderGroups(){const gs=S.groups.get(String(S.editing.id))||[];$('modGroups').innerHTML=gs.map(g=>'<div><b>'+esc(g.name)+(g.required?' *':'')+'</b>'+g.options.map(o=>'<button class="opt '+((S.selected.get(g.id)||new Set()).has(o.id)?'on':'')+'" data-g="'+g.id+'" data-o="'+o.id+'">'+esc(o.name)+(o.price?' +'+money(o.price):'')+'</button>').join('')+'</div>').join('');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=gs.find(x=>x.id===b.dataset.g),set=new Set(S.selected.get(g.id)||[]);if(g.type==='single'||g.max===1){set.clear();set.add(b.dataset.o)}else{set.has(b.dataset.o)?set.delete(b.dataset.o):set.add(b.dataset.o)}S.selected.set(g.id,set);renderGroups()})}$('modAdd').onclick=()=>{const gs=S.groups.get(String(S.editing.id))||[];for(const g of gs){const n=(S.selected.get(g.id)||new Set()).size;if(n<Math.max(g.required?1:0,g.min||0)){alert('Please complete '+g.name);return}}const mods=gs.map(g=>({name:g.name,options:g.options.filter(o=>(S.selected.get(g.id)||new Set()).has(o.id))})).filter(x=>x.options.length),extra=mods.reduce((s,g)=>s+g.options.reduce((a,o)=>a+o.price,0),0);S.cart.push({id:S.editing.id,name:S.editing.name,qty:1,unit:num(S.editing.price)+extra,mods});$('mods').classList.add('hide');renderCart()};$('modCancel').onclick=()=>$('mods').classList.add('hide');function renderCart(){$('lines').innerHTML=S.cart.length?S.cart.map((x,i)=>'<div class="line"><b>'+x.qty+' × '+esc(x.name)+'</b><div class="muted">'+x.mods.map(m=>esc(m.name)+': '+m.options.map(o=>esc(o.name)).join(', ')).join('<br>')+'</div><div class="actions"><button data-m="'+i+'">−</button><button data-p="'+i+'">+</button><button data-r="'+i+'">Remove</button></div></div>').join(''):'<div class="muted">No items added yet.</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.cart[b.dataset.p].qty++;renderCart()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const x=S.cart[b.dataset.m];x.qty--;if(x.qty<1)S.cart.splice(b.dataset.m,1);renderCart()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.cart.splice(b.dataset.r,1);renderCart()});$('total').textContent=money(S.cart.reduce((s,x)=>s+x.qty*x.unit,0))}$('send').onclick=async()=>{if(!S.cart.length)return;$('send').disabled=true;$('status').textContent='Sending order…';try{const body={table_number:TABLE,source:'qr',notes:$('note').value,items:S.cart.map(x=>({item_id:x.id,qty:x.qty,modifier_options:x.mods.flatMap(m=>m.options.map(o=>({group_id:m.name,option_id:o.id})))}))};const r=await fetch(API+'/order',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Order failed');S.cart=[];$('note').value='';renderCart();$('status').textContent='Order sent for '+PLACE+'.'}catch(e){$('status').textContent='Could not send test order: '+e.message}finally{$('send').disabled=false}};$('bill').onclick=async()=>{if(!confirm('Request the bill for '+PLACE+'?'))return;$('bill').disabled=true;$('status').textContent='Requesting bill…';try{const r=await fetch(API+'/bill',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({table_number:TABLE})}),d=await r.json();if(!r.ok)throw Error(d.error||'Bill request failed');$('status').textContent='Bill requested for staff.';setTimeout(()=>$('bill').disabled=false,3000)}catch(e){$('status').textContent='Could not request test bill: '+e.message;$('bill').disabled=false}};load().catch(e=>$('status').textContent='Menu could not load: '+e.message);</script></body></html>
