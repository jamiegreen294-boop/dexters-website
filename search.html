<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search Dexter's</title><style>body{margin:0;background:#031f33;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:860px;margin:auto;padding:28px 18px}a{color:#ffd43c}.panel{background:#06263d;border:1px solid #35536a;border-radius:18px;padding:24px}h1{font-family:Georgia,serif}input{width:100%;padding:14px;border-radius:999px;border:1px solid #6e8798}.item{display:block;padding:14px;margin:10px 0;border:1px solid #35536a;border-radius:12px;background:#062c47;color:#fff;text-decoration:none}.item span{display:block;color:#c8d7e0;font-size:13px}</style></head><body><main class="wrap"><a href="index.html">← Back to Dexter's</a><section class="panel"><h1>Search</h1><input id="q" placeholder="Search Dexter's..."><div id="results"></div></section></main><script>const pages=[["Menu & Collection","Order food for collection","https://app.dextersspot.co.uk/collection-order-test.html"],["Loyalty App","Points, stamps, rewards and offers","https://app.dextersspot.co.uk/"],["Catering","Dexter's catering information","https://app.dextersspot.co.uk/catering.html"],["Allergens","Full allergen information","allergens.html"],["Customer Information","Legal and customer information","customer-information.html"],["Contact Us","Send an enquiry to Dexter's","contact.html"],["Jobs","Current Dexter's vacancies","https://jamiegreen294-boop.github.io/dexters-recruitment-test/jobs.html"],["Staff","Staff and management systems","staff.html"],["Privacy","Privacy and data protection","privacy.html"],["Terms & Conditions","Customer terms and conditions","terms.html"],["Cookie Policy","Cookies and local storage","cookie-policy.html"],["Complaints","Complaints and feedback policy","complaints.html"],["Sunday Roast Policy","Deposit and refund policy","sunday-roast-policy.html"],["Spin to Win Terms","Promotion terms","spin-to-win-terms.html"],["Rewards Promotion Terms","Reward promotion terms","rewards-promo-terms.html"]];const q=document.getElementById("q"),out=document.getElementById("results");function draw(){const s=q.value.trim().toLowerCase();const list=s?pages.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(s)):pages;out.innerHTML=list.map(x=>'<a class="item" href="'+x[2]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></a>').join("")||"<p>No matching pages found.</p>"}q.addEventListener("input",draw);draw();</script></body></html>
